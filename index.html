<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marki et les cœurs</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ffe6f0 0%, #f7b7d2 38%, #6d28d9 100%);
      font-family: Arial, sans-serif;
      color: #2b173f;
      overflow: hidden;
    }

    .game-shell {
      width: min(1040px, 96vw);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 30px;
      padding: 18px;
      box-shadow: 0 30px 90px rgba(55, 20, 90, 0.38);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 14px;
      opacity: 0.75;
    }

    .hud {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      padding: 10px 13px;
      border-radius: 999px;
      background: #fff2f7;
      font-weight: bold;
      white-space: nowrap;
      border: 1px solid #ffd1e3;
      font-size: 14px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
      background: linear-gradient(#b9e7ff, #ffe9f5);
      border: 3px solid #ffffff;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      font-size: 14px;
      color: #53346f;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      background: #7c3aed;
      color: white;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(124, 58, 237, 0.28);
    }

    .btn:hover { transform: translateY(-1px); }

    .mobile-controls {
      display: none;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
    }

    .mobile-controls button {
      width: 62px;
      height: 48px;
      border: none;
      border-radius: 18px;
      background: #fff2f7;
      border: 1px solid #ffd1e3;
      font-weight: 900;
      color: #7c3aed;
      font-size: 18px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(35, 14, 55, 0.50);
      padding: 20px;
      z-index: 10;
    }

    .card {
      width: min(780px, 94vw);
      max-height: 92vh;
      overflow: auto;
      background: white;
      border-radius: 32px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      animation: pop 0.35s ease-out;
    }

    .card h2 {
      margin-top: 0;
      font-size: clamp(28px, 5vw, 46px);
      color: #7c3aed;
    }

    .card p {
      font-size: 18px;
      line-height: 1.65;
      margin-bottom: 24px;
      color: #2b173f;
    }

    .final-message {
      text-align: left;
      white-space: pre-line;
    }

    .hidden { display: none; }

    @media (max-width: 720px) {
      body { overflow: auto; padding: 12px 0; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .hud { justify-content: flex-start; }
      .controls { flex-direction: column; align-items: flex-start; }
      .mobile-controls { display: flex; }
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <div>
        <h1>Marki et les cœurs 💜</h1>
        <p class="subtitle">Récupère les cœurs, trouve la clé, évite les ennemis et rejoins le portail.</p>
      </div>
      <div class="hud">
        <div class="pill" id="levelBox">Niveau 1 / 3</div>
        <div class="pill" id="heartBox">Cœurs : 0 / 0</div>
        <div class="pill" id="lifeBox">Vies : 3</div>
        <div class="pill" id="keyBox">Clé : non</div>
      </div>
    </div>

    <canvas id="game" width="960" height="540"></canvas>

    <div class="controls">
      <span>Contrôles : ← → pour bouger · Espace pour sauter · R pour recommencer · P pour pause</span>
      <button class="btn" onclick="restartGame()">Recommencer</button>
    </div>

    <div class="mobile-controls">
      <button data-key="ArrowLeft">←</button>
      <button data-key="ArrowRight">→</button>
      <button data-key="Space">⤒</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="overlayTitle">Pour Marki 💌</h2>
      <p id="overlayText">Récupère tous les cœurs. Chaque cœur compte.</p>
      <button class="btn" id="overlayButton" onclick="startGame()">Commencer</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const levelBox = document.getElementById("levelBox");
    const heartBox = document.getElementById("heartBox");
    const lifeBox = document.getElementById("lifeBox");
    const keyBox = document.getElementById("keyBox");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const overlayButton = document.getElementById("overlayButton");

    const keys = {};
    let gameRunning = false;
    let paused = false;
    let levelIndex = 0;
    let lives = 3;
    let totalCollected = 0;
    let particles = [];
    let shake = 0;
    let finalFlagMode = false;
    let finalFlagTouched = false;

    const gravity = 0.72;
    const friction = 0.84;

    const player = {
      x: 60,
      y: 390,
      w: 34,
      h: 50,
      vx: 0,
      vy: 0,
      speed: 0.85,
      jump: -14.2,
      grounded: false,
      invincible: 0,
      checkpoint: { x: 60, y: 390 }
    };

    const finalMessage = `Marki,

Tous les cœurs que tu viens de ramasser n’étaient pas juste là pour finir un jeu.

Chaque cœur représentait une petite partie de ce que je ressens pour toi.

Il y en avait un pour ton sourire.
Un pour ta présence.
Un pour ta douceur.
Un pour ta beauté.
Un pour ta façon de me faire du bien sans même t’en rendre compte.
Un pour les moments où je pense à toi sans raison.
Un pour les jours où tu me manques.
Un pour les fois où tu rends ma vie plus belle juste en étant là.
Un pour tout ce que je n’arrive pas toujours à dire.
Un pour tout ce que je ressens quand je te regarde.
Un pour la place immense que tu as prise dans mon cœur.
Un pour la personne juste incroyable.
Un pour pour ta persévérance quotidienne.
Un pour la femme incroyable que tu seras.
Et un pour te rappeler que tu comptes énormément pour moi.

Mais même après tous ces cœurs, ce n’est toujours pas assez.

Parce que ce que je ressens pour toi est beaucoup plus grand qu’un jeu, plus grand qu’un message, plus grand que tous les cœurs que tu pourrais ramasser.

Je voulais te faire quelque chose de simple, mais qui vient vraiment de moi. Pas juste un message envoyé vite fait, pas juste des mots posés au hasard.
Quelque chose que j’ai créé pour toi, parce que tu comptes énormément pour moi.

Un jour je serais pas que des mots pour toi....

Je t’aime énormément Marki. Vraiment. 💜`;

    const levels = [
      {
        name: "Niveau 1",
        spawn: { x: 60, y: 390 },
        door: { x: 875, y: 392, w: 48, h: 78 },
        key: { x: 720, y: 285, taken: false },
        checkpoints: [{ x: 470, y: 410, w: 26, h: 60, active: false }],
        platforms: [
          { x: 0, y: 470, w: 960, h: 70 },
          { x: 135, y: 390, w: 135, h: 20 },
          { x: 330, y: 335, w: 125, h: 20 },
          { x: 535, y: 305, w: 125, h: 20 },
          { x: 690, y: 340, w: 130, h: 20 },
          { x: 790, y: 250, w: 110, h: 20 }
        ],
        hearts: [
          { x: 175, y: 345, taken: false },
          { x: 375, y: 290, taken: false },
          { x: 580, y: 260, taken: false },
          { x: 735, y: 295, taken: false },
          { x: 840, y: 205, taken: false },
          { x: 430, y: 425, taken: false }
        ],
        enemies: [
          { x: 500, y: 438, w: 34, h: 32, minX: 455, maxX: 610, speed: 1.15, dir: 1, alive: true },
          { x: 255, y: 358, w: 30, h: 30, minX: 140, maxX: 268, speed: 0.85, dir: -1, alive: true }
        ]
      },
      {
        name: "Niveau 2",
        spawn: { x: 55, y: 390 },
        door: { x: 870, y: 160, w: 48, h: 78 },
        key: { x: 105, y: 195, taken: false },
        checkpoints: [{ x: 525, y: 410, w: 26, h: 60, active: false }],
        platforms: [
          { x: 0, y: 470, w: 960, h: 70 },
          { x: 95, y: 380, w: 115, h: 20 },
          { x: 270, y: 320, w: 115, h: 20 },
          { x: 470, y: 370, w: 120, h: 20 },
          { x: 670, y: 315, w: 120, h: 20 },
          { x: 820, y: 238, w: 120, h: 20 },
          { x: 70, y: 250, w: 110, h: 20 },
          { x: 405, y: 250, w: 105, h: 20 },
          { x: 610, y: 210, w: 105, h: 20 }
        ],
        hearts: [
          { x: 130, y: 335, taken: false },
          { x: 310, y: 275, taken: false },
          { x: 510, y: 325, taken: false },
          { x: 710, y: 270, taken: false },
          { x: 860, y: 190, taken: false },
          { x: 455, y: 205, taken: false },
          { x: 655, y: 165, taken: false }
        ],
        enemies: [
          { x: 295, y: 288, w: 32, h: 32, minX: 270, maxX: 385, speed: 0.85, dir: 1, alive: true },
          { x: 720, y: 438, w: 34, h: 32, minX: 705, maxX: 850, speed: 1.35, dir: 1, alive: true },
          { x: 478, y: 338, w: 32, h: 32, minX: 470, maxX: 590, speed: 0.95, dir: 1, alive: true }
        ]
      },
      {
        name: "Niveau 3",
        spawn: { x: 50, y: 390 },
        door: { x: 870, y: 92, w: 48, h: 78 },
        key: { x: 505, y: 100, taken: false },
        checkpoints: [
          { x: 325, y: 410, w: 26, h: 60, active: false },
          { x: 700, y: 210, w: 26, h: 60, active: false }
        ],
        platforms: [
          { x: 0, y: 470, w: 960, h: 70 },
          { x: 90, y: 385, w: 110, h: 20 },
          { x: 250, y: 325, w: 110, h: 20 },
          { x: 430, y: 270, w: 110, h: 20 },
          { x: 635, y: 255, w: 110, h: 20 },
          { x: 810, y: 170, w: 125, h: 20 },
          { x: 460, y: 150, w: 95, h: 20 },
          { x: 690, y: 125, w: 95, h: 20 }
        ],
        hearts: [
          { x: 125, y: 340, taken: false },
          { x: 285, y: 280, taken: false },
          { x: 465, y: 225, taken: false },
          { x: 675, y: 210, taken: false },
          { x: 855, y: 125, taken: false },
          { x: 250, y: 425, taken: false },
          { x: 610, y: 425, taken: false },
          { x: 735, y: 85, taken: false },
          { x: 505, y: 105, taken: false }
        ],
        enemies: [
          { x: 110, y: 438, w: 34, h: 32, minX: 90, maxX: 200, speed: 1.2, dir: 1, alive: true },
          { x: 450, y: 238, w: 32, h: 32, minX: 430, maxX: 540, speed: 0.95, dir: 1, alive: true },
          { x: 665, y: 223, w: 32, h: 32, minX: 635, maxX: 745, speed: 1.0, dir: 1, alive: true },
          { x: 520, y: 438, w: 34, h: 32, minX: 450, maxX: 650, speed: 1.25, dir: -1, alive: true }
        ]
      }
    ];

    const flagStage = {
      name: "Drapeau final",
      spawn: { x: 65, y: 390 },
      platforms: [
        { x: 0, y: 470, w: 960, h: 70 },
        { x: 180, y: 405, w: 120, h: 20 },
        { x: 370, y: 340, w: 120, h: 20 },
        { x: 570, y: 275, w: 120, h: 20 },
        { x: 760, y: 210, w: 120, h: 20 }
      ],
      flag: { x: 845, y: 100, poleW: 8, poleH: 370, touched: false }
    };

    function level() { return levels[levelIndex]; }

    function currentPlatforms() {
      return finalFlagMode ? flagStage.platforms : level().platforms;
    }

    function totalHeartsInGame() {
      return levels.reduce((sum, l) => sum + l.hearts.length, 0);
    }

    function startGame() {
      overlay.classList.add("hidden");
      overlayText.classList.remove("final-message");
      levelIndex = 0;
      lives = 3;
      totalCollected = 0;
      finalFlagMode = false;
      finalFlagTouched = false;
      levels.forEach(resetLevelObjects);
      loadLevel();
      gameRunning = true;
      paused = false;
      requestAnimationFrame(loop);
    }

    function restartGame() {
      startGame();
    }

    function resetLevelObjects(l) {
      l.hearts.forEach(h => h.taken = false);
      l.key.taken = false;
      l.checkpoints.forEach(c => c.active = false);
      l.enemies.forEach(e => {
        e.dir = 1;
        e.alive = true;
      });
    }

    function loadLevel() {
      const l = level();
      player.x = l.spawn.x;
      player.y = l.spawn.y;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      player.invincible = 0;
      player.checkpoint = { x: l.spawn.x, y: l.spawn.y };
      particles = [];
      updateHud();
    }

    function loadFlagStage() {
      finalFlagMode = true;
      finalFlagTouched = false;
      player.x = flagStage.spawn.x;
      player.y = flagStage.spawn.y;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      player.invincible = 0;
      player.checkpoint = { x: flagStage.spawn.x, y: flagStage.spawn.y };
      particles = [];
      updateHud();
    }

    function respawnPlayer() {
      player.x = player.checkpoint.x;
      player.y = player.checkpoint.y;
      player.vx = 0;
      player.vy = 0;
      player.invincible = 90;
      shake = 12;
    }

    function hurtPlayer() {
      if (finalFlagMode) {
        respawnPlayer();
        return;
      }

      if (player.invincible > 0) return;
      lives--;
      updateHud();
      if (lives <= 0) {
        showOverlay("Essaie encore 💜", "Marki a perdu toutes ses vies. Recommence pour récupérer tous les cœurs.", "Recommencer", restartGame);
      } else {
        respawnPlayer();
      }
    }

    function updateHud() {
      if (finalFlagMode) {
        levelBox.textContent = "Final";
        heartBox.textContent = `Cœurs : ${totalCollected} / ${totalHeartsInGame()}`;
        lifeBox.textContent = `Vies : ${lives}`;
        keyBox.textContent = "Drapeau : saute dessus";
        return;
      }

      const l = level();
      const levelCollected = l.hearts.filter(h => h.taken).length;
      levelBox.textContent = `Niveau ${levelIndex + 1} / ${levels.length}`;
      heartBox.textContent = `Cœurs : ${totalCollected} / ${totalHeartsInGame()} (${levelCollected}/${l.hearts.length})`;
      lifeBox.textContent = `Vies : ${lives}`;
      keyBox.textContent = `Clé : ${l.key.taken ? "oui" : "non"}`;
    }

    function showOverlay(title, text, buttonText, action, isFinal = false) {
      gameRunning = false;
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayText.classList.toggle("final-message", isFinal);
      overlayButton.textContent = buttonText;
      overlayButton.onclick = action;
      overlay.classList.remove("hidden");
    }

    function completeLevel() {
      if (levelIndex === levels.length - 1) {
        showOverlay(
          "Dernière porte ouverte 💜",
          "Marki a ouvert la dernière porte. Il reste une dernière chose à faire : sauter sur le drapeau.",
          "Aller au drapeau",
          () => {
            overlay.classList.add("hidden");
            loadFlagStage();
            gameRunning = true;
            requestAnimationFrame(loop);
          }
        );
        return;
      }

      showOverlay(
        "Niveau réussi 💜",
        "Marki a récupéré les cœurs de ce niveau. Continue pour aller jusqu’au message final.",
        "Niveau suivant",
        () => {
          overlay.classList.add("hidden");
          levelIndex++;
          loadLevel();
          gameRunning = true;
          requestAnimationFrame(loop);
        }
      );
    }

    function touchFinalFlag() {
      if (finalFlagTouched) return;
      finalFlagTouched = true;
      burst(flagStage.flag.x, player.y, "#ec4899");
      burst(flagStage.flag.x + 25, player.y - 30, "#facc15");
      setTimeout(() => {
        showOverlay("Pour toi, Marki 💜", finalMessage, "Rejouer", restartGame, true);
      }, 500);
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#b9e7ff");
      gradient.addColorStop(1, "#ffe9f5");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,0.75)";
      drawCloud(120, 90, 38);
      drawCloud(530, 75, 48);
      drawCloud(790, 125, 34);
      drawCloud(325, 145, 30);

      ctx.fillStyle = "rgba(124,58,237,0.09)";
      ctx.beginPath(); ctx.arc(90, 450, 140, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(850, 430, 170, 0, Math.PI * 2); ctx.fill();
    }

    function drawCloud(x, y, size) {
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.arc(x + size * 0.8, y + 8, size * 0.75, 0, Math.PI * 2);
      ctx.arc(x - size * 0.8, y + 10, size * 0.65, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlatforms() {
      currentPlatforms().forEach(p => {
        ctx.fillStyle = "#ffffff";
        roundRect(p.x, p.y, p.w, p.h, 12);
        ctx.fill();
        ctx.fillStyle = "#f9a8d4";
        roundRect(p.x, p.y, p.w, 7, 12);
        ctx.fill();
      });
    }

    function drawHearts() {
      if (finalFlagMode) return;
      level().hearts.forEach(h => {
        if (!h.taken) {
          const pulse = 1 + Math.sin(performance.now() / 180 + h.x) * 0.07;
          drawHeart(h.x, h.y, 17 * pulse, "#ec4899");
        }
      });
    }

    function drawHeart(x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size / 20, size / 20);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.bezierCurveTo(-20, -8, -10, -25, 0, -12);
      ctx.bezierCurveTo(10, -25, 20, -8, 0, 8);
      ctx.fill();
      ctx.restore();
    }

    function drawKey() {
      if (finalFlagMode) return;
      const k = level().key;
      if (k.taken) return;
      const float = Math.sin(performance.now() / 250) * 4;
      ctx.save();
      ctx.translate(k.x, k.y + float);
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff7aa";
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#facc15";
      ctx.fillRect(8, -3, 28, 6);
      ctx.fillRect(29, -3, 5, 14);
      ctx.fillRect(20, -3, 5, 10);
      ctx.restore();
    }

    function drawDoor() {
      if (finalFlagMode) return;
      const d = level().door;
      const open = level().key.taken && level().hearts.every(h => h.taken);
      ctx.fillStyle = open ? "#7c3aed" : "rgba(124,58,237,0.38)";
      roundRect(d.x, d.y, d.w, d.h, 14);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "28px Arial";
      ctx.fillText(open ? "💌" : "🔒", d.x + 7, d.y + 48);
    }

    function drawFlag() {
      if (!finalFlagMode) return;
      const f = flagStage.flag;

      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(f.x, f.y, f.poleW, f.poleH);
      ctx.fillStyle = "#cbd5e1";
      ctx.fillRect(f.x + f.poleW, f.y, 3, f.poleH);

      ctx.fillStyle = finalFlagTouched ? "#22c55e" : "#ec4899";
      ctx.beginPath();
      ctx.moveTo(f.x + f.poleW, f.y + 12);
      ctx.lineTo(f.x + 85, f.y + 32);
      ctx.lineTo(f.x + f.poleW, f.y + 55);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#7c3aed";
      ctx.font = "bold 16px Arial";
      ctx.fillText("SAUTE ICI", f.x - 35, f.y - 14);
    }

    function drawCheckpoints() {
      if (finalFlagMode) return;
      level().checkpoints.forEach(c => {
        ctx.fillStyle = c.active ? "#22c55e" : "#a855f7";
        ctx.fillRect(c.x + 10, c.y, 5, c.h);
        ctx.beginPath();
        ctx.moveTo(c.x + 15, c.y + 2);
        ctx.lineTo(c.x + 42, c.y + 12);
        ctx.lineTo(c.x + 15, c.y + 24);
        ctx.closePath();
        ctx.fill();
      });
    }

    function updateEnemies() {
      if (finalFlagMode) return;
      level().enemies.forEach(e => {
        if (!e.alive) return;
        e.x += e.speed * e.dir;
        if (e.x <= e.minX || e.x + e.w >= e.maxX) e.dir *= -1;
      });
    }

    function drawEnemies() {
      if (finalFlagMode) return;
      level().enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = "#581c87";
        roundRect(e.x, e.y, e.w, e.h, 14);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(e.x + 10, e.y + 12, 3, 0, Math.PI * 2);
        ctx.arc(e.x + 23, e.y + 12, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f9a8d4";
        ctx.beginPath();
        ctx.arc(e.x + 10, e.y + 23, 4, 0, Math.PI);
        ctx.arc(e.x + 23, e.y + 23, 4, 0, Math.PI);
        ctx.fill();
      });
    }

    function drawPlayer() {
      ctx.save();
      if (player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0) ctx.globalAlpha = 0.45;

      ctx.fillStyle = "#ec4899";
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y + 24);
      ctx.lineTo(player.x + 2, player.y + player.h);
      ctx.lineTo(player.x + player.w - 2, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffd1dc";
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + 15, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#2b173f";
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y + 9, 16, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(player.x + 3, player.y + 8, 8, 25);
      ctx.fillRect(player.x + player.w - 11, player.y + 8, 8, 25);

      ctx.fillStyle = "#2b173f";
      ctx.beginPath();
      ctx.arc(player.x + 12, player.y + 15, 2, 0, Math.PI * 2);
      ctx.arc(player.x + 22, player.y + 15, 2, 0, Math.PI * 2);
      ctx.fill();

      drawHeart(player.x + player.w / 2, player.y - 8, 8, "#ec4899");

      ctx.fillStyle = "#7c3aed";
      ctx.font = "bold 13px Arial";
      ctx.fillText("Marki", player.x - 2, player.y - 16);
      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        drawHeart(p.x, p.y, p.size, p.color);
        ctx.globalAlpha = 1;
      });
    }

    function updateParticles() {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function burst(x, y, color = "#ec4899") {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.8) * 5,
          size: 6 + Math.random() * 7,
          color,
          life: 35,
          maxLife: 35
        });
      }
    }

    function drawText() {
      ctx.fillStyle = "rgba(43,23,63,0.84)";
      ctx.font = "bold 22px Arial";

      if (finalFlagMode) {
        ctx.fillText("Dernière étape — saute sur le drapeau", 24, 38);
        ctx.font = "15px Arial";
        ctx.fillText("Le message final s’affiche uniquement quand Marki touche le drapeau.", 24, 62);
        return;
      }

      const l = level();
      ctx.fillText(`${l.name} — récupère les cœurs puis la clé`, 24, 38);
      ctx.font = "15px Arial";
      ctx.fillText("Quand Marki récupère tous les cœurs et la clé, le portail s’ouvre.", 24, 62);
    }

    function updatePlayer() {
      if (player.invincible > 0) player.invincible--;

      if (keys.ArrowLeft || keys.KeyA) player.vx -= player.speed;
      if (keys.ArrowRight || keys.KeyD) player.vx += player.speed;

      if ((keys.Space || keys.ArrowUp || keys.KeyW) && player.grounded) {
        player.vy = player.jump;
        player.grounded = false;
      }

      player.vx *= friction;
      player.vy += gravity;
      if (player.vy > 18) player.vy = 18;

      const solids = currentPlatforms();

      player.x += player.vx;
      solids.forEach(p => collideHorizontal(player, p));

      player.y += player.vy;
      player.grounded = false;
      solids.forEach(p => collideVertical(player, p));

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
      if (player.y > canvas.height + 80) hurtPlayer();
    }

    function collideHorizontal(a, p) {
      if (!rectsOverlap(a, p)) return;
      if (a.vx > 0) a.x = p.x - a.w;
      else if (a.vx < 0) a.x = p.x + p.w;
      a.vx = 0;
    }

    function collideVertical(a, p) {
      if (!rectsOverlap(a, p)) return;
      if (a.vy > 0) {
        a.y = p.y - a.h;
        a.vy = 0;
        a.grounded = true;
      } else if (a.vy < 0) {
        a.y = p.y + p.h;
        a.vy = 0;
      }
    }

    function checkCollectibles() {
      if (finalFlagMode) return;
      const l = level();

      l.hearts.forEach(h => {
        if (!h.taken && rectCircleCollide(player, h.x, h.y, 22)) {
          h.taken = true;
          totalCollected++;
          burst(h.x, h.y);
          updateHud();
        }
      });

      if (!l.key.taken && rectCircleCollide(player, l.key.x, l.key.y, 24)) {
        l.key.taken = true;
        burst(l.key.x, l.key.y, "#facc15");
        updateHud();
      }

      l.checkpoints.forEach(c => {
        if (rectsOverlap(player, c)) {
          l.checkpoints.forEach(cp => cp.active = false);
          c.active = true;
          player.checkpoint = { x: c.x, y: c.y - player.h };
        }
      });
    }

    function checkDanger() {
      if (finalFlagMode) return;

      level().enemies.forEach(e => {
        if (!e.alive) return;
        if (rectsOverlap(player, e)) {
          const playerBottomBefore = player.y + player.h - player.vy;
          if (player.vy > 0 && playerBottomBefore <= e.y + 10) {
            e.alive = false;
            player.vy = -10;
            burst(player.x + player.w / 2, player.y + player.h, "#a855f7");
          } else {
            hurtPlayer();
          }
        }
      });
    }

    function checkDoor() {
      if (finalFlagMode) return;
      const l = level();
      const open = l.key.taken && l.hearts.every(h => h.taken);
      if (open && rectsOverlap(player, l.door)) {
        completeLevel();
      }
    }

    function checkFlag() {
      if (!finalFlagMode || finalFlagTouched) return;
      const f = flagStage.flag;
      const pole = { x: f.x - 8, y: f.y, w: 28, h: f.poleH };
      if (rectsOverlap(player, pole)) touchFinalFlag();
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function rectCircleCollide(rect, cx, cy, radius) {
      const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
      const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < radius * radius;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function loop() {
      if (!gameRunning) return;
      if (paused) {
        requestAnimationFrame(loop);
        return;
      }

      updateEnemies();
      updatePlayer();
      checkCollectibles();
      checkDanger();
      checkDoor();
      checkFlag();
      updateParticles();

      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.86;
        if (shake < 0.5) shake = 0;
      }

      drawBackground();
      drawPlatforms();
      drawCheckpoints();
      drawDoor();
      drawFlag();
      drawKey();
      drawHearts();
      drawEnemies();
      drawPlayer();
      drawParticles();
      drawText();
      ctx.restore();

      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", e => {
      keys[e.code] = true;
      if (e.code === "KeyR") restartGame();
      if (e.code === "KeyP") paused = !paused;
    });

    document.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    document.querySelectorAll(".mobile-controls button").forEach(btn => {
      const code = btn.dataset.key;
      btn.addEventListener("touchstart", e => { e.preventDefault(); keys[code] = true; });
      btn.addEventListener("touchend", e => { e.preventDefault(); keys[code] = false; });
      btn.addEventListener("mousedown", () => keys[code] = true);
      btn.addEventListener("mouseup", () => keys[code] = false);
      btn.addEventListener("mouseleave", () => keys[code] = false);
    });

    updateHud();
  </script>
</body>
</html>
